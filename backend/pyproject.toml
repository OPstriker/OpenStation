[project]
name = "app"
version = "0.1.0"
description = "Weather station backend and sensor collector"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard]>=0.141.1,<1.0.0",
    "pydantic>=2.13.5",
    "alembic>=1.19.1,<2.0.0",
    "httpx<1.0.0,>=0.25.1",
    "psycopg[binary]>=3.3.6,<4.0.0",
    "sqlmodel>=0.0.46,<1.0.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "gpiozero>=2.0.1,<3.0.0",
    # I2C for the SPA06-003 barometer (pure Python, installs on the Mac too).
    "smbus2>=0.5.1,<1.0.0",
    # Raspberry Pi GPIO backend for gpiozero; only built into the linux/arm64 image.
    "lgpio>=0.2.2.0 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[dependency-groups]
dev = [
    "pytest<10.0.0,>=7.4.3",
    "mypy<3.0.0,>=1.8.0",
    "ty>=0.0.25",
    "ruff<1.0.0,>=0.16.0",
    "coverage<8.0.0,>=7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[[tool.mypy.overrides]]
module = ["gpiozero", "gpiozero.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.ty.terminal]
error-on-warning = true

[tool.fastapi]
entrypoint = "app.main:app"
